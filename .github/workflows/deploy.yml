name: Сборка и публикация сайта

on:
  push:
    branches: [main]
  # Кнопка ручного запуска на вкладке Actions — на случай, когда надо
  # перевыложить без новых коммитов.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Публикация одна на всех: параллельные выкладки только мешают друг
# другу. Начатую не отменяем, чтобы сайт не остался наполовину новым.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ci вместо install: ставит ровно то, что записано в замке, и не
      # переписывает его на ходу.
      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
